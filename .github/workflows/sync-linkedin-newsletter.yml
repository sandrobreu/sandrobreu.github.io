name: Sync LinkedIn newsletter

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 6 */2 * *"

permissions:
  contents: write

concurrency:
  group: linkedin-newsletter-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests python-dateutil
          python -m playwright install --with-deps chromium

      - name: Sync latest Weekly Bytes editions
        env:
          LINKEDIN_NEWSLETTER_URL: https://www.linkedin.com/newsletters/7113976045355048961/
        run: python scripts/sync_linkedin_newsletter.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data/newsletter.json img/blog; then
            echo "No newsletter changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/newsletter.json img/blog
          git commit -m "Sync latest LinkedIn newsletter editions"
          git push
