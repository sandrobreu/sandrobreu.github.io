name: Modernize portfolio site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/site-modernization.yml

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install modernization dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 git-filter-repo
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Modernize HTML, SEO and language support
        run: python scripts/modernize_site.py

      - name: Optimize media assets
        run: |
          ffmpeg -y -i img/background_video.mp4 -an -c:v libvpx-vp9 -crf 40 -b:v 0 -vf "scale='min(1280,iw)':-2,fps=24" -row-mt 1 -threads 4 img/background_video.webm
          ffmpeg -y -i img/main_photo.png -c:v libwebp -q:v 82 img/main_photo.webp
          rm -f img/background_video.mp4 img/background_video_test.mp4 img/CV_Breu_Sandro_v2.pdf
          echo "Optimized asset sizes:"
          du -h img/background_video.webm img/main_photo.webp

      - name: Validate generated site
        run: |
          test -s img/background_video.webm
          test -s img/main_photo.webp
          grep -q 'background_video.webm' index.html
          grep -q 'main_photo.webp' index.html
          grep -q 'Digital Transformation &amp; Data Engineer' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'js/i18n.js' index.html
          test ! -e img/CV_Breu_Sandro_v2.pdf
          ! grep -q 'CV_Breu_Sandro_v2.pdf' index.html
          ! grep -q 'Currently enrolled in the MAS' index.html

      - name: Commit modernization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Modernize portfolio site"
          git pull --rebase origin main
          git push origin main

      - name: Remove CV from Git history
        run: |
          git filter-repo --path img/CV_Breu_Sandro_v2.pdf --invert-paths --force
          git remote add origin https://github.com/sandrobreu/sandrobreu.github.io.git
          git push --force origin main
